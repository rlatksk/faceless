[browser]
gatherUsageStats = false

# Keep in sync with the :root palette in the _CSS block of app.py. These values
# theme Streamlit's own widgets (radio dots, sliders, toggles, checkboxes), which
# CSS cannot fully reach.
[theme]
base = "dark"
primaryColor = "#ffb000"
backgroundColor = "#050705"
secondaryBackgroundColor = "#0a0d0a"
textColor = "#cfe3cf"
font = "monospace"
